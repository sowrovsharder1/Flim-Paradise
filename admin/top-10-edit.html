<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Add Top 10 | FilmParadise BD</title>

  <meta
    name="description"
    content="Create a Top 10 movie list for FilmParadise BD."
  >

  <link
    rel="stylesheet"
    href="/assets/css/style.css"
  >

  <style>

    .top10-edit-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 70px;
    }

    .top10-edit-header {
      margin-bottom: 30px;
    }

    .top10-edit-header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .top10-edit-header p {
      margin: 0;
      opacity: .7;
    }

    .top10-form-section {
      margin-bottom: 28px;
      padding: 24px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .top10-form-section h2 {
      margin: 0 0 20px;
      font-size: 22px;
      color: #ffd84d;
    }

    .top10-form-group {
      margin-bottom: 18px;
    }

    .top10-form-group:last-child {
      margin-bottom: 0;
    }

    .top10-form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .top10-form-group input,
    .top10-form-group textarea,
    .top10-form-group select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.25);
      color: inherit;
      font: inherit;
      outline: none;
    }

    .top10-form-group input:focus,
    .top10-form-group textarea:focus,
    .top10-form-group select:focus {
      border-color: rgba(255,216,77,.7);
    }

    .top10-form-group textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.6;
    }

    .top10-post-info {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 18px;
    }

    .top10-item {
      position: relative;
      margin-bottom: 24px;
      padding: 22px;
      border-radius: 12px;
      background: rgba(255,255,255,.025);
      border: 1px solid rgba(255,255,255,.08);
    }

    .top10-item:last-child {
      margin-bottom: 0;
    }

    .top10-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top10-item-rank {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      color: #ffd84d;
    }

    .top10-item-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 6px;
      background: rgba(255,255,255,.08);
      font-size: 12px;
      opacity: .75;
    }

    .top10-item-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 18px;
    }

    .top10-poster-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top10-poster-preview {
      width: 100%;
      max-width: 180px;
      height: 255px;
      border-radius: 9px;
      overflow: hidden;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 12px;
      opacity: .7;
    }

    .top10-poster-preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .top10-file-input {
      font-size: 12px;
    }

    .top10-file-input::file-selector-button {
      margin-right: 8px;
      padding: 7px 10px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .top10-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .top10-save-btn,
    .top10-cancel-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
      box-sizing: border-box;
    }

    .top10-save-btn {
      border: 1px solid #e50914;
      background: #e50914;
      color: #fff;
    }

    .top10-save-btn:hover {
      opacity: .9;
    }

    .top10-save-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .top10-cancel-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: inherit;
    }

    .top10-cancel-btn:hover {
      background: rgba(255,255,255,.1);
    }

    .top10-status {
      min-height: 20px;
      font-size: 14px;
      opacity: .9;
    }

    .top10-status.success {
      color: #69e781;
    }

    .top10-status.error {
      color: #ff6b6b;
    }

    .top10-note {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      opacity: .6;
    }

    @media (max-width: 800px) {

      .top10-post-info {
        grid-template-columns: 1fr;
      }

      .top10-item-grid {
        grid-template-columns: 1fr;
      }

      .top10-poster-preview {
        max-width: 150px;
        height: 215px;
      }

    }

    @media (max-width: 600px) {

      .top10-edit-page {
        padding: 28px 14px 50px;
      }

      .top10-edit-header h1 {
        font-size: 27px;
      }

      .top10-form-section {
        padding: 17px;
      }

      .top10-item {
        padding: 16px;
      }

      .top10-item-header {
        align-items: flex-start;
      }

      .top10-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .top10-save-btn,
      .top10-cancel-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header class="site-header">

  <div class="container">

    <div class="site-header-inner">

      <a
        href="/admin/"
        class="brand"
      >
        FilmParadise BD
      </a>


      <nav class="site-nav">

        <a href="/admin/">
          Dashboard
        </a>

        <a href="/admin/add">
          Add Title
        </a>

        <a
          href="/admin/top-10.html"
          class="active"
        >
          Top 10
        </a>

        <a href="/">
          View Site
        </a>

      </nav>

    </div>

  </div>

</header>



<main class="top10-edit-page">


  <div class="top10-edit-header">

    <h1>
      Add Top 10 Post
    </h1>

    <p>
      Create a separate Top 10 movie list with 10 ranked movies.
    </p>

  </div>



  <form id="top10-edit-form">


    <!-- TOP 10 POST INFORMATION -->

    <section class="top10-form-section">

      <h2>
        Top 10 Post Information
      </h2>


      <div class="top10-post-info">

        <div class="top10-form-group">

          <label for="top10-title">
            Top 10 Segment Title
          </label>

          <input
            type="text"
            id="top10-title"
            name="title"
            placeholder="Example: Top 10 Horror Movies You Should Watch"
            required
          >

          <div class="top10-note">
            This will be the main title of your Top 10 post.
          </div>

        </div>


        <div class="top10-form-group">

          <label for="top10-status">
            Status
          </label>

          <select
            id="top10-status"
            name="status"
          >

            <option value="published">
              Published
            </option>

            <option value="draft">
              Draft
            </option>

          </select>

        </div>

      </div>


      <div class="top10-form-group">

        <label for="top10-description">
          Short Description
        </label>

        <textarea
          id="top10-description"
          name="description"
          placeholder="Write a short introduction for this Top 10 list..."
        ></textarea>

      </div>

    </section>



    <!-- MOVIES -->

    <section class="top10-form-section">

      <h2>
        Top 10 Movies
      </h2>


      <div id="top10-items-container"></div>

    </section>



    <!-- ACTIONS -->

    <div class="top10-actions">

      <button
        type="submit"
        id="top10-save-btn"
        class="top10-save-btn"
      >
        Save Top 10 Post
      </button>


      <a
        href="/admin/top-10.html"
        class="top10-cancel-btn"
      >
        Cancel
      </a>


      <span
        id="top10-status-message"
        class="top10-status"
      ></span>

    </div>


  </form>


</main>



<footer class="site-footer">

  <div class="container">

    <p>
      © FilmParadise BD. All rights reserved.
    </p>

  </div>

</footer>



<script src="/assets/js/api.js"></script>
<script src="/assets/js/admin/common.js"></script>



<script>

document.addEventListener(
  "DOMContentLoaded",
  async function () {

    /*
    =====================================================
    ADMIN LOGIN
    =====================================================
    */

    if (
      window.admin &&
      typeof window.admin.requireLogin === "function"
    ) {

      await window.admin.requireLogin();

    }


    /*
    =====================================================
    ELEMENTS
    =====================================================
    */

    const form =
      document.getElementById(
        "top10-edit-form"
      );

    const saveButton =
      document.getElementById(
        "top10-save-btn"
      );

    const statusMessage =
      document.getElementById(
        "top10-status-message"
      );

    const itemsContainer =
      document.getElementById(
        "top10-items-container"
      );


    /*
    =====================================================
    CREATE 10 MOVIE FORMS
    =====================================================
    */

    for (
      let rank = 1;
      rank <= 10;
      rank++
    ) {

      const item =
        document.createElement("div");

      item.className =
        "top10-item";


      item.innerHTML = `

        <div class="top10-item-header">

          <h3 class="top10-item-rank">
            #${rank} Movie
          </h3>

          ${
            rank === 1
              ? `
                <span class="top10-item-badge">
                  Main Poster
                </span>
              `
              : ""
          }

        </div>


        <div class="top10-item-grid">

          <div>

            <div class="top10-form-group">

              <label for="top10-title-${rank}">
                Movie Title
              </label>

              <input
                type="text"
                id="top10-title-${rank}"
                placeholder="Movie title"
                required
              >

            </div>


            <div class="top10-form-group">

              <label for="top10-year-${rank}">
                Release Year
              </label>

              <input
                type="number"
                id="top10-year-${rank}"
                placeholder="2025"
                min="1800"
                max="2100"
              >

            </div>


            <div class="top10-form-group">

              <label for="top10-language-${rank}">
                Language
              </label>

              <input
                type="text"
                id="top10-language-${rank}"
                placeholder="English"
                required
              >

            </div>


            <div class="top10-form-group">

              <label for="top10-description-${rank}">
                Short Description
              </label>

              <textarea
                id="top10-description-${rank}"
                placeholder="Write a short description of this movie..."
              ></textarea>

            </div>

          </div>


          <div class="top10-poster-area">

            <label>
              Poster
            </label>

            <div
              class="top10-poster-preview"
              id="top10-poster-preview-${rank}"
            >
              No poster selected
            </div>

            <input
              class="top10-file-input"
              type="file"
              id="top10-poster-${rank}"
              accept="image/jpeg,image/png,image/webp"
              required
            >

          </div>

        </div>

      `;


      itemsContainer.appendChild(
        item
      );

    }


    /*
    =====================================================
    POSTER PREVIEW
    =====================================================
    */

    for (
      let rank = 1;
      rank <= 10;
      rank++
    ) {

      const input =
        document.getElementById(
          `top10-poster-${rank}`
        );

      const preview =
        document.getElementById(
          `top10-poster-preview-${rank}`
        );


      input.addEventListener(
        "change",
        function () {

          const file =
            input.files &&
            input.files[0];


          if (!file) {

            preview.textContent =
              "No poster selected";

            return;

          }


          const allowedTypes = [
            "image/jpeg",
            "image/png",
            "image/webp"
          ];


          if (
            !allowedTypes.includes(
              file.type
            )
          ) {

            input.value = "";

            preview.textContent =
              "Please select JPG, PNG or WebP.";

            return;

          }


          if (
            file.size > 5 * 1024 * 1024
          ) {

            input.value = "";

            preview.textContent =
              "Poster must be 5MB or smaller.";

            return;

          }


          const reader =
            new FileReader();


          reader.onload =
            function (event) {

              preview.innerHTML = "";


              const img =
                document.createElement(
                  "img"
                );


              img.src =
                event.target.result;


              img.alt =
                `#${rank} poster preview`;


              preview.appendChild(
                img
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    /*
    =====================================================
    FORM SUBMIT
    =====================================================
    */

    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        saveButton.disabled =
          true;


        statusMessage.className =
          "top10-status";


        statusMessage.textContent =
          "Preparing Top 10 post...";


        try {

          /*
          -----------------------------------------------
          TOP 10 INFORMATION
          -----------------------------------------------
          */

          const title =
            document
              .getElementById(
                "top10-title"
              )
              .value
              .trim();


          const description =
            document
              .getElementById(
                "top10-description"
              )
              .value
              .trim();


          const status =
            document
              .getElementById(
                "top10-status"
              )
              .value;


          if (!title) {

            throw new Error(
              "Top 10 Segment Title is required."
            );

          }


          /*
          -----------------------------------------------
          COLLECT MOVIES
          -----------------------------------------------
          */

          const movies = [];


          for (
            let rank = 1;
            rank <= 10;
            rank++
          ) {

            const movieTitle =
              document
                .getElementById(
                  `top10-title-${rank}`
                )
                .value
                .trim();


            const yearValue =
              document
                .getElementById(
                  `top10-year-${rank}`
                )
                .value
                .trim();


            const language =
              document
                .getElementById(
                  `top10-language-${rank}`
                )
                .value
                .trim();


            const movieDescription =
              document
                .getElementById(
                  `top10-description-${rank}`
                )
                .value
                .trim();


            const posterInput =
              document.getElementById(
                `top10-poster-${rank}`
              );


            const file =
              posterInput.files &&
              posterInput.files[0];


            if (!movieTitle) {

              throw new Error(
                `Movie title is required for #${rank}.`
              );

            }


            if (!language) {

              throw new Error(
                `Language is required for #${rank}.`
              );

            }


            if (!file) {

              throw new Error(
                `Please select a poster for #${rank}.`
              );

            }


            movies.push({

              rank: rank,

              title: movieTitle,

              release_year:
                yearValue
                  ? Number(yearValue)
                  : null,

              language: language,

              short_description:
                movieDescription,

              file: file

            });

          }


          /*
          -----------------------------------------------
          UPLOAD POSTERS
          -----------------------------------------------
          */

          const savedItems = [];


          for (
            const movie of movies
          ) {

            statusMessage.textContent =
              `Uploading poster ${movie.rank}/10...`;


            const uploadForm =
              new FormData();


            uploadForm.append(
              "file",
              movie.file
            );


            uploadForm.append(
              "rank",
              String(movie.rank)
            );


            const uploadResponse =
              await fetch(
                "/api/top10/upload",
                {
                  method: "POST",
                  credentials: "include",
                  body: uploadForm
                }
              );


            let uploadResult;


            try {

              uploadResult =
                await uploadResponse.json();

            } catch (error) {

              throw new Error(
                `Invalid upload response for #${movie.rank}.`
              );

            }


            if (
              !uploadResponse.ok ||
              !uploadResult.ok
            ) {

              throw new Error(
                uploadResult.error ||
                `Poster upload failed for #${movie.rank}.`
              );

            }


            savedItems.push({

              rank:
                movie.rank,

              title:
                movie.title,

              release_year:
                movie.release_year,

              language:
                movie.language,

              short_description:
                movie.short_description,

              poster_key:
                uploadResult.key,

              poster_url:
                uploadResult.url

            });

          }


          /*
          -----------------------------------------------
          SAVE TO D1
          -----------------------------------------------
          */

          statusMessage.textContent =
            "Saving Top 10 post to database...";


          const response =
            await fetch(
              "/api/top10/posts",
              {
                method: "POST",

                credentials: "include",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({

                    title:
                      title,

                    description:
                      description,

                    status:
                      status,

                    items:
                      savedItems

                  })
              }
            );


          let result;


          try {

            result =
              await response.json();

          } catch (error) {

            throw new Error(
              "The server returned an invalid response."
            );

          }


          if (
            !response.ok ||
            !result.ok
          ) {

            throw new Error(
              result.error ||
              "Failed to save Top 10 post."
            );

          }


          /*
          -----------------------------------------------
          SUCCESS
          -----------------------------------------------
          */

          statusMessage.className =
            "top10-status success";


          statusMessage.textContent =
            "Top 10 post saved successfully!";


          saveButton.textContent =
            "Saved ✓";


          setTimeout(
            function () {

              window.location.href =
                "/admin/top-10.html";

            },
            1000
          );


        } catch (error) {

          console.error(
            "Top 10 save error:",
            error
          );


          statusMessage.className =
            "top10-status error";


          statusMessage.textContent =
            error.message ||
            "Something went wrong while saving.";


          saveButton.disabled =
            false;

        }

      }
    );

  }
);

</script>


</body>

</html>
