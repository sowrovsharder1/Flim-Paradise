<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-side-brand" href="/"><span>FILM</span>PARADISE <b>BD</b></a><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/movies.html">Movies & Series</a><a href="/admin/movie-form.html">Add Title</a><a class="active" href="/admin/articles.html">Articles</a><a href="/admin/article-form.html">Add Article</a><a href="/admin/reviews.html">Reviews</a><a href="/admin/categories.html">Categories</a><a href="#" id="logoutBtn">Log out</a></nav></aside><main class="admin-main"><div class="admin-header"><h1>Articles</h1><a class="btn btn-primary" href="/admin/article-form.html">+ Write article</a></div><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></main></div><script src="/assets/js/api.js"></script><script src="/assets/js/admin/common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await admin.requireLogin();try{const d=await fp.apiFetch('/admin/articles');document.getElementById('rows').innerHTML=d.articles.map(a=>`<tr><td>${fp.esc(a.title)}</td><td>${fp.esc(a.content_type)}</td><td><span class="badge ${a.status}">${fp.esc(a.status)}</span></td><td>${fp.formatDate(a.updated_at)}</td><td><a class="btn btn-ghost" href="/admin/article-form.html?slug=${encodeURIComponent(a.slug)}">Edit</a></td></tr>`).join('')||'<tr><td colspan="5">No articles yet.</td></tr>'}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="5">${fp.esc(e.message)}</td></tr>`}});</script></body></html>
