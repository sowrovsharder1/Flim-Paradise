<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — FilmParadise BD</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><main class="login-shell"><form class="login-card" id="loginForm"><div class="brand"><span>FILM</span>PARADISE <b>BD</b></div><h1>Admin Login</h1><p style="color:var(--muted)">Manage titles, articles and community reviews.</p><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" style="width:100%;margin-top:8px">Sign in</button><div id="msg" class="form-msg"></div></form></main><script src="/assets/js/api.js"></script><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const b=Object.fromEntries(new FormData(e.currentTarget));try{await fp.apiFetch('/auth/login',{method:'POST',body:JSON.stringify(b)});location.href='/admin/index.html'}catch(x){msg.textContent=x.message;msg.className='form-msg err'}});</script></body></html>
