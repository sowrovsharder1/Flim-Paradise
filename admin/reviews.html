<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviews — Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-side-brand" href="/"><span>FILM</span>PARADISE <b>BD</b></a><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/movies.html">Movies & Series</a><a href="/admin/movie-form.html">Add Title</a><a href="/admin/articles.html">Articles</a><a href="/admin/article-form.html">Add Article</a><a class="active" href="/admin/reviews.html">Reviews</a><a href="/admin/categories.html">Categories</a><a href="#" id="logoutBtn">Log out</a></nav></aside><main class="admin-main"><div class="admin-header"><div><div class="eyebrow">COMMUNITY</div><h1>Review Moderation</h1></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Movie</th><th>Author</th><th>Rating</th><th>Comment</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></main></div><script src="/assets/js/api.js"></script><script src="/assets/js/admin/common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await admin.requireLogin();async function load(){try{const d=await fp.apiFetch('/reviews?status=pending');document.getElementById('rows').innerHTML=d.reviews.map(r=>`<tr><td>${fp.esc(r.movie_title)}</td><td>${fp.esc(r.author_name)}</td><td><span class="score">${fp.esc(r.rating)}/10</span></td><td>${fp.esc(r.comment).slice(0,180)}</td><td><span class="badge pending">pending</span></td><td><div style="display:flex;gap:6px"><button class="btn btn-primary" data-ok="${r.id}">Approve</button><button class="btn btn-ghost" data-no="${r.id}">Reject</button></div></td></tr>`).join('')||'<tr><td colspan="6">No pending reviews.</td></tr>';document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await fp.apiFetch('/reviews/'+b.dataset.ok,{method:'PUT',body:JSON.stringify({status:'approved'})});load()});document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{await fp.apiFetch('/reviews/'+b.dataset.no,{method:'PUT',body:JSON.stringify({status:'rejected'})});load()});}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="6">${fp.esc(e.message)}</td></tr>`}}load()});</script></body></html>
