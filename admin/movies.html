<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movies — Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-side-brand" href="/"><span>FILM</span>PARADISE <b>BD</b></a><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a class="active" href="/admin/movies.html">Movies & Series</a><a href="/admin/movie-form.html">Add Title</a><a href="/admin/articles.html">Articles</a><a href="/admin/article-form.html">Add Article</a><a href="/admin/reviews.html">Reviews</a><a href="/admin/categories.html">Categories</a><a href="#" id="logoutBtn">Log out</a></nav></aside><main class="admin-main"><div class="admin-header"><h1>Movies & Series</h1><a class="btn btn-primary" href="/admin/movie-form.html">+ Add title</a></div><div class="table-wrap" style="margin-top:20px"><table class="table"><thead><tr><th>Title</th><th>Type</th><th>Year</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></main></div><script src="/assets/js/api.js"></script><script src="/assets/js/admin/common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{if(!await admin.requireLogin())return;try{const d=await fp.apiFetch('/admin/movies');document.getElementById('rows').innerHTML=d.movies.map(m=>`<tr><td><a href="/movie.html?slug=${encodeURIComponent(m.slug)}" target="_blank">${fp.esc(m.title)}</a></td><td>${fp.esc(m.type)}</td><td>${fp.esc(m.year||'—')}</td><td><span class="badge ${m.status}">${fp.esc(m.status)}</span></td><td>${fp.formatDate(m.updated_at)}</td><td><a class="btn btn-ghost" href="/admin/movie-form.html?slug=${encodeURIComponent(m.slug)}">Edit</a></td></tr>`).join('')||'<tr><td colspan="6">No titles yet.</td></tr>'}catch(e){document.getElementById('rows').innerHTML=`<tr><td colspan="6">${fp.esc(e.message)}</td></tr>`}});</script></body></html>
