<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-side-brand" href="/"><span>FILM</span>PARADISE <b>BD</b></a><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/movies.html">Movies & Series</a><a href="/admin/movie-form.html">Add Title</a><a href="/admin/articles.html">Articles</a><a class="active" href="/admin/article-form.html">Add Article</a><a href="/admin/reviews.html">Reviews</a><a href="/admin/categories.html">Categories</a><a href="#" id="logoutBtn">Log out</a></nav></aside><main class="admin-main"><div class="admin-header"><h1 id="heading">Write Article</h1></div><form class="admin-form" id="form"><div class="form-grid"><div class="full"><label>Title *</label><input name="title" required></div><div><label>Slug</label><input name="slug"></div><div><label>Article type</label><select name="content_type"><option value="review">Movie Review</option><option value="news">Movie News</option><option value="trailer">Trailer</option><option value="box-office">Box Office</option><option value="recommendation">Top 10 / Recommendation</option><option value="feature">Feature</option></select></div><div class="full"><label>Excerpt</label><textarea name="excerpt" rows="3"></textarea></div><div class="full"><label>Cover image URL</label><input name="cover_url"></div><div><label>Related movie ID (optional)</label><input name="movie_id" type="number"></div><div><label>Category label</label><input name="category"></div><div class="full"><label>Article body</label><textarea name="body" rows="18" placeholder="Write your original article here. Separate paragraphs with a blank line."></textarea></div><div><label>Status</label><select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></div><div><label class="checkbox-row"><input type="checkbox" name="is_featured"> Featured on homepage</label></div></div><div style="margin-top:18px;display:flex;gap:10px"><button class="btn btn-primary">Save article</button><a class="btn btn-ghost" href="/admin/articles.html">Cancel</a><button type="button" class="btn btn-ghost" id="delete" style="display:none">Delete</button><span id="msg" class="form-msg"></span></div></form></main></div><script src="/assets/js/api.js"></script><script src="/assets/js/admin/common.js"></script><script src="/assets/js/admin/article-form.js"></script></body></html>
