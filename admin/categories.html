<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories — Admin</title><link rel="stylesheet" href="/assets/css/style.css"></head><body class="admin-body"><div class="admin-shell"><aside class="admin-sidebar"><a class="brand admin-side-brand" href="/"><span>FILM</span>PARADISE <b>BD</b></a><nav class="admin-nav"><a href="/admin/index.html">Dashboard</a><a href="/admin/movies.html">Movies & Series</a><a href="/admin/movie-form.html">Add Title</a><a href="/admin/articles.html">Articles</a><a href="/admin/article-form.html">Add Article</a><a href="/admin/reviews.html">Reviews</a><a class="active" href="/admin/categories.html">Categories</a><a href="#" id="logoutBtn">Log out</a></nav></aside><main class="admin-main"><div class="admin-header"><h1>Categories</h1></div><form class="admin-form" id="catForm" style="max-width:600px"><div class="form-grid"><div><label>Name</label><input name="name" required></div><div><label>Slug</label><input name="slug" required></div><div><label>Sort order</label><input name="sort_order" type="number" value="100"></div></div><button class="btn btn-primary" style="margin-top:14px">Add category</button><span id="msg" class="form-msg"></span></form><div class="table-wrap" style="margin-top:20px"><table class="table"><thead><tr><th>Name</th><th>Slug</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script src="/assets/js/api.js"></script><script src="/assets/js/admin/common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{await admin.requireLogin();async function load(){const d=await fp.apiFetch('/categories');document.getElementById('rows').innerHTML=d.categories.map(c=>`<tr><td>${fp.esc(c.name)}</td><td>${fp.esc(c.slug)}</td><td><button class="btn btn-ghost" data-del="${c.id}">Delete</button></td></tr>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete category?')){await fp.apiFetch('/categories/'+b.dataset.del,{method:'DELETE'});load()}})}document.getElementById('catForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));try{await fp.apiFetch('/categories',{method:'POST',body:JSON.stringify(b)});e.currentTarget.reset();load()}catch(x){document.getElementById('msg').textContent=x.message;document.getElementById('msg').className='form-msg err'}};load()});</script></body></html>
